name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.adoc'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install asciidoctor
        run: gem install asciidoctor --no-document

      # docs/ carries AsciiDoc sources, not a Jekyll site — render
      # them with asciidoctor and ship the HTML as the Pages
      # artifact.
      - name: Render documentation
        run: |
          mkdir -p _site
          asciidoctor docs/lml-models-and-instances-syntax.adoc \
            -o _site/index.html -a stylesheet=default
          cp README.adoc _site/
          asciidoctor _site/README.adoc -o _site/readme.html \
            -a stylesheet=default

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
